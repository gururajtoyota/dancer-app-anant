<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dance Showcase · Choreography Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="aurora"></div>

    <header class="page-header">
        <div class="titles">
            <h1 id="showTitle">Dance Showcase</h1>
            <p id="showSubtitle">Choreography Tracker</p>
        </div>
        <div class="header-actions">
            <div class="stats" id="stats"></div>
            <a class="btn ghost" id="downloadBtn" href="data/choreography.yaml" download="choreography.yaml">Download
                YAML</a>
        </div>
    </header>

    <main>
        <div class="table-head">
            <span>#</span>
            <span>Song</span>
            <span>Dancers</span>
            <span>Duration</span>
            <span>Status</span>
            <span>Notes</span>
        </div>
        <section id="list" class="list"></section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <template id="rowTemplate">
        <article class="row">
            <div class="cell order">
                <span class="order-num"></span>
            </div>
            <div class="cell song">
                <span class="song-text"></span>
            </div>
            <div class="cell dancers">
                <div class="chips"></div>
            </div>
            <div class="cell duration">
                <span class="duration-text"></span>
            </div>
            <div class="cell status">
                <span class="status-pill"></span>
            </div>
            <div class="cell notes">
                <span class="notes-text"></span>
            </div>
        </article>
    </template>

    <script src="yaml.js"></script>
    <script src="app.js"></script>
</body>

</html>
