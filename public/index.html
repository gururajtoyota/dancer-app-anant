<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dance Showcase · Choreography Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="aurora"></div>

    <header class="page-header">
        <div class="titles">
            <h1 id="showTitle">Dance Showcase</h1>
            <p id="showSubtitle">Choreography Tracker</p>
        </div>
        <div class="header-actions">
            <div class="stats" id="stats"></div>
            <a class="btn ghost" id="downloadBtn" href="api/data.yaml" download="choreography.yaml">Download YAML</a>
            <button class="btn ghost" id="unlockBtn" type="button" hidden>Edit</button>
            <button class="btn ghost" id="lockBtn" type="button" hidden>Done</button>
            <button class="btn primary" id="saveBtn" type="button" hidden>Save</button>
        </div>
    </header>

    <section class="show-info" id="showInfo">
        <div class="card theme-card">
            <div class="card-head">
                <h2>Theme &amp; Script</h2>
            </div>
            <textarea id="themeText" class="theme-textarea"
                placeholder="Describe the theme and script of the show — the story it tells, the order of moments, any narration…"
                readonly></textarea>
        </div>
        <div class="card audio-card">
            <div class="card-head">
                <h2>Full Show Track</h2>
            </div>
            <audio id="masterAudioPlayer" class="master-audio-player" controls preload="none" hidden></audio>
            <div id="masterAudioEmbed" class="master-audio-embed" hidden>
                <iframe id="masterAudioFrame" title="Full show track" allow="autoplay" loading="lazy"></iframe>
            </div>
            <div class="master-audio-view">
                <a class="master-audio-link" id="masterAudioLink" target="_blank" rel="noopener noreferrer">🎵 Open
                    full track</a>
                <span class="master-audio-empty" id="masterAudioEmpty">No full-show audio added yet</span>
            </div>
            <label class="master-audio-upload edit-only" for="masterAudioUpload">
                <span class="btn ghost">⬆ Upload full show track</span>
                <input type="file" id="masterAudioUpload" accept="audio/*" hidden />
            </label>
            <span class="master-audio-upload-status edit-only" id="masterAudioUploadStatus"></span>
        </div>
    </section>

    <main>
        <div class="filters" id="filters">
            <label class="filter">
                <span>Dancer</span>
                <select id="dancerFilter">
                    <option value="">Everyone</option>
                </select>
            </label>
            <label class="filter">
                <span>Status</span>
                <select id="statusFilter">
                    <option value="">Any</option>
                    <option value="planned">Planned</option>
                    <option value="rehearsing">Rehearsing</option>
                    <option value="ready">Ready</option>
                </select>
            </label>
            <button class="btn ghost" id="clearFilters" type="button" hidden>Clear</button>
            <span class="filter-count" id="filterCount"></span>
        </div>

        <div class="table-head">
            <span>#</span>
            <span>Song</span>
            <span>Dancers</span>
            <span>Duration</span>
            <span>Status</span>
            <span>Audio</span>
            <span>Video</span>
            <span>Notes</span>
            <span class="edit-only"></span>
        </div>
        <section id="list" class="list"></section>
        <button class="btn add edit-only" id="addBtn" type="button">+ Add dance number</button>
    </main>

    <datalist id="dancerOptions"></datalist>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog id="unlockDialog" class="dialog">
        <form method="dialog" id="unlockForm">
            <h2>Enter edit passcode</h2>
            <input type="password" id="passcodeInput" autocomplete="current-password" placeholder="Passcode" required />
            <p class="dialog-error" id="unlockError" hidden>Wrong passcode</p>
            <menu>
                <button class="btn ghost" value="cancel" type="button" id="unlockCancel">Cancel</button>
                <button class="btn primary" type="submit">Unlock</button>
            </menu>
        </form>
    </dialog>

    <dialog id="audioDialog" class="dialog audio-dialog">
        <div class="audio-dialog-head">
            <h2 id="audioDialogTitle">Audio</h2>
            <button type="button" class="icon-btn" id="audioDialogClose" aria-label="Close">✕</button>
        </div>
        <audio id="audioDialogPlayer" class="audio-dialog-player" controls autoplay hidden></audio>
        <div id="audioDialogEmbed" class="audio-dialog-embed" hidden>
            <iframe id="audioDialogFrame" title="Audio player" allow="autoplay" loading="lazy"></iframe>
        </div>
    </dialog>

    <template id="rowTemplate">
        <article class="row">
            <div class="cell order">
                <span class="order-num"></span>
                <div class="order-moves edit-only">
                    <button type="button" class="move up" title="Move up" aria-label="Move up">▲</button>
                    <button type="button" class="move down" title="Move down" aria-label="Move down">▼</button>
                </div>
            </div>
            <div class="cell song">
                <input class="song-input" type="text" placeholder="Song name" readonly />
            </div>
            <div class="cell dancers">
                <div class="chips"></div>
                <input class="dancer-input edit-only" type="text" placeholder="+ dancer" list="dancerOptions" />
            </div>
            <div class="cell duration">
                <input class="duration-input" type="text" placeholder="mm:ss" readonly />
            </div>
            <div class="cell status">
                <select class="status-select" disabled>
                    <option value="planned">Planned</option>
                    <option value="rehearsing">Rehearsing</option>
                    <option value="ready">Ready</option>
                </select>
            </div>
            <div class="cell audio">
                <a class="audio-link" target="_blank" rel="noopener noreferrer">🎵 Audio</a>
                <span class="audio-empty">🎵 No Audio</span>
                <input class="audio-input edit-only" type="url" inputmode="url" placeholder="https://…" />
            </div>
            <div class="cell video">
                <a class="video-link" target="_blank" rel="noopener noreferrer">Practice Video</a>
                <span class="video-empty">▶ No Video</span>
                <input class="video-input edit-only" type="url" inputmode="url" placeholder="https://…" />
            </div>
            <div class="cell notes">
                <input class="notes-input" type="text" placeholder="Notes" readonly />
            </div>
            <div class="cell actions edit-only">
                <button type="button" class="icon-btn delete" title="Remove number"
                    aria-label="Remove number">✕</button>
            </div>
        </article>
    </template>

    <script src="yaml.js"></script>
    <script src="app.js"></script>
</body>

</html>
