services:
  - type: web
    name: dance-view
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: node server.js
    autoDeploy: true
    envVars:
      # Set these in the Render dashboard - never commit their values.
      - key: EDIT_PASSCODE
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
